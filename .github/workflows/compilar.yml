name: Compilar listas

on: [push, pull_request, workflow_dispatch]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baixar o Lombok (usado na lista 13)
        run: curl -sSL -o "$RUNNER_TEMP/lombok.jar" https://repo1.maven.org/maven2/org/projectlombok/lombok/1.18.34/lombok-1.18.34.jar

      - name: Compilar cada exercício
        run: |
          erros=0
          for d in lista-*/exercicio-*/; do
            if (cd "$d" && javac -encoding UTF-8 -cp "$RUNNER_TEMP/lombok.jar" -d "$RUNNER_TEMP/out/$d" $(find . -name '*.java')); then
              echo "OK    $d"
            else
              echo "ERRO  $d"
              erros=$((erros+1))
            fi
          done
          echo "Exercícios com erro: $erros"
          test "$erros" -eq 0
